<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <style>
    :root { color-scheme: light dark; }
    body { width: 300px; margin: 0; padding: 14px; font: 13px/1.5 system-ui, "Segoe UI", sans-serif; }
    h1 { margin: 0 0 8px; font-size: 13px; font-weight: 600; }
    p { margin: 0 0 10px; color: #6b6b6b; font-size: 12px; }
    button { width: 100%; padding: 8px 10px; font: inherit; font-weight: 600; cursor: pointer;
             border: 0; border-radius: 8px; background: #2f6feb; color: #fff; }
    button:disabled { opacity: .6; cursor: default; }
    #status { margin: 10px 0 0; font-size: 12px; min-height: 2.6em; overflow-wrap: anywhere; }
    #status.error { color: #c0392b; }
    #status.ok { color: #1e8e3e; }
  </style>
</head>
<body>
  <h1>发送 YouTube 登录态</h1>
  <p>先确认这个浏览器已登录 YouTube，然后点下面的按钮。cookie 只发送到本机 127.0.0.1。</p>
  <button id="send" type="button">发送到 Video Parser</button>
  <p id="status" role="status" aria-live="polite"></p>
  <script src="popup.js"></script>
</body>
</html>
